<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="plane" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Signal waves from tail -->
  <path d="M145 340 Q120 315 145 290" fill="none" stroke="url(#wave)" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
  <path d="M120 365 Q80 315 120 265" fill="none" stroke="url(#wave)" stroke-width="8" stroke-linecap="round" opacity="0.3"/>
  <path d="M95 390 Q40 315 95 240" fill="none" stroke="url(#wave)" stroke-width="8" stroke-linecap="round" opacity="0.2"/>
  <!-- Paper airplane - ascending 45deg -->
  <g transform="translate(256, 256) rotate(-35)">
    <!-- Main body -->
    <polygon points="-140,0 100,-30 100,30" fill="url(#plane)" opacity="0.95"/>
    <!-- Top wing fold -->
    <polygon points="-140,0 100,-30 40,-80" fill="#3B82F6" opacity="0.8"/>
    <!-- Bottom wing fold -->
    <polygon points="-140,0 100,30 40,60" fill="#1D4ED8" opacity="0.7"/>
    <!-- Center fold line -->
    <line x1="-140" y1="0" x2="100" y2="0" stroke="#60A5FA" stroke-width="2" opacity="0.5"/>
  </g>
  <!-- Subtle mesh dots -->
  <circle cx="380" cy="140" r="4" fill="#059669" opacity="0.6"/>
  <circle cx="400" cy="180" r="3" fill="#059669" opacity="0.4"/>
  <circle cx="360" cy="165" r="3" fill="#059669" opacity="0.5"/>
  <line x1="380" y1="140" x2="400" y2="180" stroke="#059669" stroke-width="1" opacity="0.3"/>
  <line x1="380" y1="140" x2="360" y2="165" stroke="#059669" stroke-width="1" opacity="0.3"/>
  <line x1="400" y1="180" x2="360" y2="165" stroke="#059669" stroke-width="1" opacity="0.3"/>
</svg>
