name: flight_chat
description: Offline BLE mesh messaging for airplane passengers
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^15.1.0
  provider: ^6.1.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.0
  uuid: ^4.5.0
  google_fonts: ^6.2.0
  intl: ^0.20.2
  flutter_svg: ^2.0.0
  sqflite: ^2.4.0
  path: ^1.9.0
  pointycastle: ^3.9.0
  encrypt: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Necessaria per i test dei repository su SQLite in memoria, che il
  # piano di Fase 2 richiede senza elencare la dipendenza. Solo test.
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/logo/
